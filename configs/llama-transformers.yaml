# Llama 3.1 8B Instruct loaded in-process with Hugging Face transformers.
#   pip install "versarag[transformers,embeddings,quant]"
#   huggingface-cli login     (Llama weights are gated: accept the license on the model page)
llm:
  provider: huggingface
  model: meta-llama/Llama-3.1-8B-Instruct
  load_in_4bit: true          # ~6 GB VRAM; set false for full bf16 (~16 GB)
  max_new_tokens: 1024
  temperature: 0.2

embeddings:
  provider: sentence_transformers
  model: BAAI/bge-small-en-v1.5

vectorstore:
  provider: numpy
  path: .rag_index_bge_small
